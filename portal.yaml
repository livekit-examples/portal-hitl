# Shared by robot, human operator, policy, and recorder.
version: 1

fps: 30 # observation rate

reuse_stale_frames: true

videos:
  - { name: arm_camera, codec: h264, max_bitrate_kbps: 20000, screencast: true }
  # Overhead camera: uncomment on every host and set B601_CAM_OVERHEAD on the robot.
  # - { name: overhead_camera, codec: h264, max_bitrate_kbps: 20000, screencast: true }

state:
  - { name: shoulder_pan.pos, dtype: f32 }
  - { name: shoulder_lift.pos, dtype: f32 }
  - { name: elbow_flex.pos, dtype: f32 }
  - { name: wrist_flex.pos, dtype: f32 }
  - { name: wrist_yaw.pos, dtype: f32 }
  - { name: wrist_roll.pos, dtype: f32 }
  - { name: gripper.pos, dtype: f32 }

action:
  - { name: shoulder_pan.pos, dtype: f32 }
  - { name: shoulder_lift.pos, dtype: f32 }
  - { name: elbow_flex.pos, dtype: f32 }
  - { name: wrist_flex.pos, dtype: f32 }
  - { name: wrist_yaw.pos, dtype: f32 }
  - { name: wrist_roll.pos, dtype: f32 }
  - { name: gripper.pos, dtype: f32 }
