[project]
name = "portal-hitl"
version = "0.1.0"
description = "A tutorial on human-in-the-loop robot learning with LiveKit Portal."
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-portal[rerun,lerobot]>=0.3.0rc1",
    "livekit-api>=0.7",
    "lerobot[rebot,hardware]>=0.6.1",
    "numpy>=1.24",
    "python-dotenv>=1",
    "opencv-python>=4.5",
    "pynput>=1.7",
]

# `uv run robot`, `uv run teleoperator`, `uv run recorder`
[project.scripts]
robot = "robot:run"
teleoperator = "teleoperator:run"
recorder = "recorder:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["_common", "robot", "teleoperator", "recorder"]
packages = ["utils"]

[dependency-groups]
# Training alone needs no robot, LiveKit connection, or desktop input.
train = ["lerobot[training]>=0.6.1"]
