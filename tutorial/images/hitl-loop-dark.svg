<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-labelledby="t d">
<title id="t">The HITL loop</title>
<desc id="d">Collect teleop demos; the recorder archives them. Convert them into a LeRobot dataset, train ACT, then run ACT while you correct it. Every correction feeds the next training run.</desc>
<style>
.trace { opacity: 0; filter: drop-shadow(0 0 2px #1FD5F9); animation-name: trace; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes trace { 0% { stroke-dashoffset: 28px; opacity: 1; } 85% { opacity: 1; } 100% { stroke-dashoffset: calc(-1 * var(--len)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .trace { display: none; } }
</style>
<defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"><line x1="0" y1="6" x2="6" y2="0" stroke="#30302F" stroke-width="1.5" stroke-opacity="0.3"/></pattern>
<radialGradient id="fade" cx="50%" cy="50%" r="65%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="gridmask"><rect width="900" height="290" fill="url(#fade)"/></mask>
